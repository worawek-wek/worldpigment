<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" role="img" aria-label="World Pigment - ระบบเทียบสี">
  <defs>
    <linearGradient id="wpLiquid" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#54BAB9"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="wpGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e8f6f6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wpCardShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ─── พื้นหลังนุ่ม ๆ ตาม theme ─── -->
  <circle cx="120" cy="130" r="160" fill="#54BAB9" opacity="0.10"/>
  <circle cx="545" cy="515" r="185" fill="#6c5ce7" opacity="0.10"/>
  <circle cx="560" cy="135" r="58" fill="#f0a500" opacity="0.12"/>
  <circle cx="95" cy="470" r="40" fill="#e74c3c" opacity="0.10"/>

  <!-- เงาใต้ภาพ -->
  <ellipse cx="320" cy="548" rx="172" ry="24" fill="#2a3142" opacity="0.06"/>

  <!-- ═══ พัดเทียบสี (fan deck แบบ Pantone) — หมุนรอบหมุดที่ (320,520) ═══ -->
  <g stroke="#ffffff" stroke-width="3">
    <g transform="rotate(-60 320 520)">
      <rect x="292" y="296" width="56" height="216" rx="14" fill="#e74c3c"/>
      <rect x="292" y="296" width="56" height="216" rx="14" fill="url(#wpCardShine)"/>
    </g>
    <g transform="rotate(-40 320 520)">
      <rect x="292" y="296" width="56" height="216" rx="14" fill="#f39c12"/>
      <rect x="292" y="296" width="56" height="216" rx="14" fill="url(#wpCardShine)"/>
    </g>
    <g transform="rotate(-20 320 520)">
      <rect x="292" y="296" width="56" height="216" rx="14" fill="#f1c40f"/>
      <rect x="292" y="296" width="56" height="216" rx="14" fill="url(#wpCardShine)"/>
    </g>
    <g transform="rotate(0 320 520)">
      <rect x="292" y="296" width="56" height="216" rx="14" fill="#2ecc71"/>
      <rect x="292" y="296" width="56" height="216" rx="14" fill="url(#wpCardShine)"/>
    </g>
    <g transform="rotate(20 320 520)">
      <rect x="292" y="296" width="56" height="216" rx="14" fill="#54BAB9"/>
      <rect x="292" y="296" width="56" height="216" rx="14" fill="url(#wpCardShine)"/>
    </g>
    <g transform="rotate(40 320 520)">
      <rect x="292" y="296" width="56" height="216" rx="14" fill="#3498db"/>
      <rect x="292" y="296" width="56" height="216" rx="14" fill="url(#wpCardShine)"/>
    </g>
    <g transform="rotate(60 320 520)">
      <rect x="292" y="296" width="56" height="216" rx="14" fill="#6c5ce7"/>
      <rect x="292" y="296" width="56" height="216" rx="14" fill="url(#wpCardShine)"/>
    </g>
  </g>
  <!-- หมุดยึดพัด -->
  <circle cx="320" cy="520" r="18" fill="#2a3142"/>
  <circle cx="320" cy="520" r="7" fill="#ffffff" opacity="0.55"/>

  <!-- ═══ ขวดทดลอง (flask) — สื่อ lab เทียบสี ═══ -->
  <g transform="translate(150 150) rotate(-12)">
    <path d="M22 6 h44 v52 l40 78 a30 30 0 0 1 -27 44 h-70 a30 30 0 0 1 -27 -44 l40 -78 z"
          fill="url(#wpGlass)" stroke="#54BAB9" stroke-width="5" stroke-linejoin="round"/>
    <path d="M14 124 a30 30 0 0 0 27 44 h70 a30 30 0 0 0 27 -44 l-12 -24 h-100 z"
          fill="url(#wpLiquid)"/>
    <rect x="16" y="2" width="56" height="12" rx="6" fill="#54BAB9"/>
    <circle cx="58" cy="140" r="6" fill="#ffffff" opacity="0.5"/>
    <circle cx="78" cy="128" r="4" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- ═══ เม็ดพิกเมนต์ลอย ═══ -->
  <circle cx="470" cy="250" r="22" fill="#e74c3c" opacity="0.9"/>
  <circle cx="463" cy="243" r="6" fill="#ffffff" opacity="0.4"/>
  <circle cx="510" cy="320" r="15" fill="#f1c40f" opacity="0.9"/>
  <circle cx="430" cy="330" r="11" fill="#6c5ce7" opacity="0.85"/>
  <circle cx="135" cy="300" r="13" fill="#3498db" opacity="0.85"/>
  <circle cx="180" cy="380" r="9" fill="#2ecc71" opacity="0.85"/>

  <!-- ประกาย -->
  <g fill="#f0a500">
    <path d="M500 180 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z"/>
  </g>
  <g fill="#54BAB9">
    <path d="M120 220 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z"/>
  </g>

  <!-- ═══ ตรา "เทียบสีผ่าน" (check badge) ═══ -->
  <g transform="translate(452 392)">
    <circle cx="0" cy="0" r="42" fill="#2ecc71"/>
    <circle cx="0" cy="0" r="42" fill="url(#wpCardShine)"/>
    <path d="M-18 2 l12 13 24 -27" fill="none" stroke="#ffffff" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
